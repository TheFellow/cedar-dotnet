name: CI

on:
  push:
  pull_request:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semport Guard
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi

          bash .github/scripts/semport_guard.sh "$range"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore cedar-dotnet.sln

      - name: Lint
        run: dotnet format cedar-dotnet.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Build
        run: dotnet build cedar-dotnet.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test cedar-dotnet.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack cedar-dotnet.sln --configuration Release --no-build --output artifacts/packages
